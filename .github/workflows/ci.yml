name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Parameter ledger schema (offline)
        run: PYTHONPATH=. python scripts/validate_ovarian_parameter_ledger.py
      - name: Python tests (quantum vs experiment, engine vs OpenMM referee, body vs clinical)
        run: pytest -q -m "not network"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export engine references and test the JavaScript engines
        run: |
          python scripts/export_web.py
          node web/test_engines.mjs

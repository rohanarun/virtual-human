[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-human"
version = "0.1.0"
description = "Multi-scale virtual human: from-scratch atomistic engine (JAX) + whole-body physiology, coupled."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohan Arun" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "jax>=0.4.30",
]

[project.optional-dependencies]
# structure preparation (parameter assignment) and the independent referee used in tests
prep = ["openmm>=8.1", "pdbfixer>=1.9"]
# the quantum accuracy ceiling (rungs 4-5): ab initio electronic structure + geometry optimization
quantum = ["pyscf>=2.5", "geometric>=1.0"]
dev = ["pytest>=8", "matplotlib>=3.8", "openmm>=8.1", "pdbfixer>=1.9", "pyscf>=2.5", "geometric>=1.0"]

[tool.setuptools.packages.find]
include = ["vh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # scipy's expm (scaling-and-squaring in _matfuncs) raises spurious
    # divide/overflow/invalid matmul RuntimeWarnings on this platform even for
    # valid input matrices (they fire inside plain pbpk.simulate as well);
    # results are unaffected. Scoped to the two scipy frames that emit them.
    'ignore::RuntimeWarning:scipy.linalg._matfuncs',
    'ignore::RuntimeWarning:numpy.linalg._linalg',
]
